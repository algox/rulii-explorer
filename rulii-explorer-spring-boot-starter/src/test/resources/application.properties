# Both web stacks and Spring Security are on the test classpath so the matrix can cover them.
# Tests pick the stack with spring.main.web-application-type; security stays off unless a test
# clears this exclusion.
rulii.explorer.enabled=true
spring.main.web-application-type=servlet
spring.autoconfigure.exclude=\
  org.springframework.boot.security.autoconfigure.SecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.ServletWebSecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.servlet.SecurityFilterAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.actuate.web.servlet.ManagementWebSecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.web.reactive.ReactiveWebSecurityAutoConfiguration,\
  org.springframework.boot.security.autoconfigure.actuate.web.reactive.ReactiveManagementWebSecurityAutoConfiguration
