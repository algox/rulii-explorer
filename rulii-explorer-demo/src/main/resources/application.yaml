spring:
  application:
    name: order-service

management:
  endpoints:
    web:
      exposure:
        # The descriptor endpoint is opt-in, like every Actuator endpoint.
        include: health, rulii

# Thresholds the rules read through ${...} placeholders. The explorer shows the keys and
# defaults as written, never these values.
order:
  minTotal: 100
pricing:
  vipDiscount: 0.10
  maxPrice: 10000
shipping:
  freeOver: 75
