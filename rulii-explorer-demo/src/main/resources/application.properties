spring.application.name=order-service

# The explorer is off by default; the demo exists to show it.
rulii.explorer.enabled=true

# The descriptor endpoint is opt-in, like every Actuator endpoint.
management.endpoints.web.exposure.include=health,rulii

# Placeholder values are off by default. The demo opts in to show them: each ${...} placeholder
# then carries the value its script compiled with. The usual secret names stay hidden, and the
# demo also hides the VIP discount, as a commercially sensitive number would be.
rulii.explorer.placeholders.show-values=always
rulii.explorer.placeholders.additional-exclude=pricing.vipDiscount

# Thresholds the rules read through ${...} placeholders. Some differ from the defaults written
# in the rules on purpose, so the explorer shows both.
order.minTotal=120
pricing.vipDiscount=0.15
pricing.maxPrice=10000
shipping.freeOver=75

# Thresholds the Java rules read (rules/order/fulfilment.xml).
shipping.expressOver=200
shipping.splitAbove=5

# Thresholds the JavaScript rules read (rules/pricing/loyalty.xml and LoyaltyConfig).
loyalty.minTotal=30
loyalty.bulkItems=10
loyalty.seniorAge=65
loyalty.goldPoints=1000

