# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    # The browser tests launch Chromium only. Install it (with its Linux libraries) once here,
    # instead of letting Playwright.create() download all three browsers on every build and warn
    # about WebKit's missing libraries.
    - name: Install Chromium for Playwright
      run: >
        mvn -B -q -pl rulii-explorer-ui
        org.codehaus.mojo:exec-maven-plugin:3.5.0:java
        -Dexec.mainClass=com.microsoft.playwright.CLI
        -Dexec.classpathScope=test
        -Dexec.args="install --with-deps chromium"
    # screens.compare=false: the screenshot baselines are Windows renders; Linux Chromium
    # antialiases text differently, so the pixel comparison is a local check only. The Linux
    # screenshots are uploaded below for eyeballing.
    # scale.minFps=15: the scale test's pan-and-zoom frame rate is software-rendered on a shared
    # runner (measured 24.8 fps against the local floor of 25); the value is still recorded.
    - name: Build with Maven
      run: mvn -B clean package -U -Dscreens.compare=false -Dscale.minFps=15
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    - name: Upload browser screenshots and test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: browser-screens
        path: |
          rulii-explorer-ui/target/screens/
          **/target/surefire-reports/
        retention-days: 7
        if-no-files-found: ignore
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/target/site/jacoco/jacoco.xml'
