<title>rulii explorer — UI concept</title>
<style>
  :root {
    color-scheme: light;
    --bg:        #f9f9f7;
    --surface:   #fcfcfb;
    --sunken:    #f3f2ef;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --hairline:  #e1e0d9;
    --border:    rgba(11,11,11,0.10);
    --c-rule:    #2a78d6;
    --c-ruleset: #eb6834;
    --c-flow:    #1baf7a;
    --c-bind:    #898781;
    --accent:    #2a78d6;
    --code-key:  #1c5cab;
    --code-str:  #0e7a55;
    --code-num:  #b4530f;
    --shadow: 0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg:        #0d0d0d;
      --surface:   #1a1a19;
      --sunken:    #141413;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #898781;
      --hairline:  #2c2c2a;
      --border:    rgba(255,255,255,0.10);
      --c-rule:    #3987e5;
      --c-ruleset: #d95926;
      --c-flow:    #199e70;
      --c-bind:    #898781;
      --accent:    #3987e5;
      --code-key:  #86b6ef;
      --code-str:  #4cc39a;
      --code-num:  #e8935e;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:        #0d0d0d;
    --surface:   #1a1a19;
    --sunken:    #141413;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --muted:     #898781;
    --hairline:  #2c2c2a;
    --border:    rgba(255,255,255,0.10);
    --c-rule:    #3987e5;
    --c-ruleset: #d95926;
    --c-flow:    #199e70;
    --c-bind:    #898781;
    --accent:    #3987e5;
    --code-key:  #86b6ef;
    --code-str:  #4cc39a;
    --code-num:  #e8935e;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: ui-monospace, "Cascadia Code", Consolas, "SF Mono", monospace; }

  .app { display: flex; flex-direction: column; height: 100vh; min-height: 640px; }

  /* ── Top bar ─────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 0 20px; height: 52px; flex: 0 0 auto;
    background: var(--surface);
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { display: block; }
  .brand .name { font-weight: 650; letter-spacing: -0.01em; font-size: 15px; }
  .brand .name span { color: var(--muted); font-weight: 450; }
  .env-chip {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; color: var(--ink-2);
    background: var(--sunken); border: 1px solid var(--hairline);
    border-radius: 99px; padding: 3px 10px;
  }
  .topbar .spacer { flex: 1; }
  .search {
    display: flex; align-items: center; gap: 8px;
    background: var(--sunken); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 5px 10px; width: 260px;
  }
  .search svg { flex: 0 0 auto; opacity: .55; }
  .search input {
    border: 0; outline: 0; background: transparent; width: 100%;
    font: inherit; color: var(--ink);
  }
  .search input::placeholder { color: var(--muted); }
  .search:focus-within { border-color: var(--accent); }
  .stat-row { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
  .stat-row b { color: var(--ink); font-weight: 600; }

  /* ── Main layout ─────────────────────────────── */
  .body { display: flex; flex: 1 1 auto; min-height: 0; }

  .sidebar {
    width: 248px; flex: 0 0 auto; min-height: 0;
    border-right: 1px solid var(--hairline);
    background: var(--surface);
    overflow-y: auto; padding: 10px 0 20px;
  }
  .group-label {
    font-size: 10.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); padding: 14px 16px 5px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .group-label .count { font-weight: 500; letter-spacing: 0; }
  .item {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 6px 16px; border: 0; background: transparent; text-align: left;
    font: inherit; color: var(--ink); cursor: pointer;
  }
  .item:hover { background: var(--sunken); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item.active { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .item .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .item .dot.sq { border-radius: 2px; }
  .item .dot.dm { transform: rotate(45deg); border-radius: 1px; }
  .item .txt { min-width: 0; }
  .item .nm {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item .sub { font-size: 11px; color: var(--muted); }
  .item.active .nm { font-weight: 600; }

  .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .tabs {
    display: flex; gap: 2px; align-items: center;
    padding: 8px 16px 0; border-bottom: 1px solid var(--hairline);
    background: var(--surface); flex: 0 0 auto;
  }
  .tab {
    font: inherit; font-size: 13px; font-weight: 550; color: var(--ink-2);
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    padding: 7px 12px 9px; cursor: pointer;
  }
  .tab:hover { color: var(--ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 4px; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .tab[disabled] { color: var(--muted); cursor: default; }
  .tab[disabled] em { font-style: normal; font-size: 10.5px; opacity: .8; margin-left: 4px; }

  .canvas-wrap { flex: 1 1 auto; position: relative; min-height: 0; overflow: hidden; }
  .view { position: absolute; inset: 0; display: none; }
  .view.on { display: block; }

  /* legend / controls overlay */
  .canvas-hud {
    position: absolute; left: 14px; top: 12px; z-index: 3;
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .legend {
    pointer-events: auto;
    display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: blur(4px);
    border: 1px solid var(--hairline); border-radius: 10px;
    padding: 8px 14px; box-shadow: var(--shadow);
    font-size: 12px; color: var(--ink-2);
  }
  .legend .li { display: flex; align-items: center; gap: 7px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 50%; }
  .legend .sw.sq { border-radius: 3px; width: 11px; height: 11px; }
  .legend .sw.dm { transform: rotate(45deg); border-radius: 2px; width: 10px; height: 10px; }
  .legend .edge-sw { width: 22px; height: 0; border-top: 2px solid var(--ink-2); }
  .legend .edge-sw.dash { border-top-style: dashed; }
  .legend .edge-sw.dot  { border-top-style: dotted; border-top-color: var(--muted); }
  .legend .sep { width: 1px; align-self: stretch; background: var(--hairline); margin: 0 2px; }
  .legend label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .legend input { accent-color: var(--accent); }

  .hint-chip {
    pointer-events: none;
    align-self: flex-start;
    font-size: 11.5px; color: var(--muted);
    background: color-mix(in srgb, var(--surface) 80%, transparent);
    border: 1px solid var(--hairline); border-radius: 99px; padding: 3px 10px;
  }

  svg.stage { width: 100%; height: 100%; display: block; cursor: grab; }
  svg.stage:active { cursor: grabbing; }

  /* graph marks */
  .g-edge { stroke: var(--ink-2); stroke-width: 1.4; fill: none; opacity: .55; }
  .g-edge.contains { stroke: var(--hairline); stroke-width: 2.4; opacity: 1; }
  .g-edge.dynamic  { stroke-dasharray: 5 4; }
  .g-edge.databind { stroke: var(--muted); stroke-dasharray: 1.5 3.5; stroke-width: 1.2; opacity: .6; }
  .g-node { cursor: pointer; }
  .g-node .shape { stroke: var(--surface); stroke-width: 2; }
  .g-node text {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11px; fill: var(--ink); paint-order: stroke;
    stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round;
  }
  .g-node .kind-label { font-size: 9px; fill: var(--muted); stroke-width: 2.5px; }
  .dim { opacity: .16; transition: opacity .15s; }
  .g-node, .g-edge { transition: opacity .15s; }
  .sel-ring { fill: none; stroke: var(--accent); stroke-width: 2; }

  .tooltip {
    position: absolute; z-index: 5; pointer-events: none;
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 8px;
    box-shadow: var(--shadow); padding: 8px 11px; max-width: 260px;
    font-size: 12px; color: var(--ink-2); display: none;
  }
  .tooltip .t-name { font-family: ui-monospace, Consolas, monospace; font-weight: 600; color: var(--ink); font-size: 12px; }
  .tooltip .t-kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }

  /* ── Flow view ───────────────────────────────── */
  .flow-scroll { position: absolute; inset: 0; overflow: auto; }
  .flow-inner { min-width: 860px; padding: 56px 24px 40px; display: flex; justify-content: center; }
  .fl-node-rect { fill: var(--surface); stroke: var(--hairline); rx: 8; }
  .fl-label { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; fill: var(--ink); }
  .fl-sub   { font-size: 9.5px; fill: var(--muted); font-family: system-ui, sans-serif; }
  .fl-kind  { font-size: 8.5px; font-weight: 700; letter-spacing: .1em; fill: var(--muted); font-family: system-ui, sans-serif; }
  .fl-edge  { stroke: var(--ink-2); stroke-width: 1.4; fill: none; opacity: .6; }
  .fl-edge.async { stroke-dasharray: 5 4; }
  .fl-edge-label { font-size: 10px; fill: var(--ink-2); font-family: system-ui, sans-serif; }
  .fl-lane-label { font-size: 10px; font-weight: 650; letter-spacing: .1em; fill: var(--muted); font-family: system-ui, sans-serif; }

  /* ── JSON view ───────────────────────────────── */
  .json-scroll { position: absolute; inset: 0; overflow: auto; padding: 20px 24px; }
  .json-card {
    background: var(--surface); border: 1px solid var(--hairline); border-radius: 12px;
    box-shadow: var(--shadow); max-width: 780px; margin: 0 auto;
  }
  .json-card .bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--hairline);
    font-size: 12px; color: var(--ink-2);
  }
  .json-card .bar code { color: var(--ink); background: var(--sunken); padding: 2px 8px; border-radius: 6px; font-size: 11.5px; }
  .json-card .bar .method { color: var(--c-flow); font-weight: 700; font-size: 11px; letter-spacing: .05em; }
  .json-card pre {
    margin: 0; padding: 16px 20px; overflow-x: auto;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 12px; line-height: 1.55; color: var(--ink-2);
  }
  .jk { color: var(--code-key); }
  .js { color: var(--code-str); }
  .jn { color: var(--code-num); }
  .jc { color: var(--muted); font-style: italic; }

  /* ── Detail panel ────────────────────────────── */
  .detail {
    width: 316px; flex: 0 0 auto; min-height: 0; overflow-y: auto;
    border-left: 1px solid var(--hairline); background: var(--surface);
  }
  .detail .empty {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: var(--muted); font-size: 12.5px; padding: 24px; text-align: center;
  }
  .d-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--hairline); }
  .type-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    padding: 3px 9px; border-radius: 99px; margin-bottom: 9px;
  }
  .type-badge .b-dot { width: 7px; height: 7px; border-radius: 50%; }
  .d-name { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 16px; font-weight: 650; word-break: break-all; }
  .d-desc { color: var(--ink-2); font-size: 12.5px; margin-top: 5px; }
  .d-sec { padding: 13px 18px; border-bottom: 1px solid var(--hairline); }
  .d-sec h4 {
    margin: 0 0 8px; font-size: 10.5px; font-weight: 650; letter-spacing: .09em;
    text-transform: uppercase; color: var(--muted);
  }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 4px 10px; font-size: 12px; }
  .kv .k { color: var(--muted); }
  .kv .v { color: var(--ink); overflow-wrap: anywhere; }
  .kv .v.mono { font-size: 11.5px; }
  .expr {
    background: var(--sunken); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 8px 11px; margin: 6px 0 0;
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: 11.5px; line-height: 1.5; color: var(--ink);
    overflow-x: auto; white-space: pre;
  }
  .expr .ctx { color: var(--code-key); }
  .expr .ph  { color: var(--code-num); }
  .expr-role { font-size: 10.5px; color: var(--muted); margin-top: 9px; letter-spacing: .04em; }
  .expr-role:first-child { margin-top: 0; }
  .opaque-note {
    display: flex; gap: 8px; align-items: flex-start;
    background: var(--sunken); border: 1px solid var(--hairline); border-radius: 8px;
    padding: 8px 11px; font-size: 11.5px; color: var(--ink-2);
  }
  .param-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .param-table th {
    text-align: left; font-weight: 600; color: var(--muted); font-size: 10.5px;
    padding: 2px 8px 5px 0; border-bottom: 1px solid var(--hairline);
  }
  .param-table td { padding: 5px 8px 5px 0; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  .param-table tr:last-child td { border-bottom: 0; }
  .param-table .pn { font-family: ui-monospace, Consolas, monospace; color: var(--ink); }
  .param-table .pt { font-family: ui-monospace, Consolas, monospace; color: var(--ink-2); font-size: 11px; }
  .req { color: var(--c-ruleset); font-weight: 700; }
  .rel-list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
  .rel-list button {
    display: flex; align-items: center; gap: 8px; width: 100%;
    font: inherit; font-size: 12px; color: var(--ink); text-align: left;
    background: transparent; border: 0; border-radius: 6px; padding: 4px 6px; cursor: pointer;
  }
  .rel-list button:hover { background: var(--sunken); }
  .rel-list button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .rel-list .rel-kind { color: var(--muted); font-size: 11px; margin-left: auto; flex:0 0 auto; }
  .rel-list .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .rel-list .nm { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .b-chip {
    font-family: ui-monospace, Consolas, monospace; font-size: 11px;
    border: 1px solid var(--hairline); background: var(--sunken);
    border-radius: 6px; padding: 2px 8px; color: var(--ink-2);
  }
  .b-chip.w { border-style: dashed; }

  @media (prefers-reduced-motion: reduce) {
    .g-node, .g-edge, .dim { transition: none; }
  }
  @media (max-width: 1080px) { .detail { width: 272px; } .sidebar { width: 208px; } }
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
        <circle cx="6" cy="6" r="3.4" fill="var(--c-rule)"/>
        <rect x="13" y="3" width="6.4" height="6.4" rx="1.6" fill="var(--c-ruleset)"/>
        <path d="M11 13.2 L14.8 17 L11 20.8 L7.2 17 Z" fill="var(--c-flow)"/>
        <path d="M8.8 7.8 L13.4 5.6 M9 8.6 L10.6 14.2" stroke="var(--muted)" stroke-width="1.1"/>
      </svg>
      <div class="name">rulii <span>explorer</span></div>
    </div>
    <span class="env-chip">order-service · dev</span>
    <div class="spacer"></div>
    <div class="stat-row" id="stats"></div>
    <div class="search">
      <svg width="13" height="13" viewBox="0 0 13 13" fill="none" aria-hidden="true">
        <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8.8 8.8 L12 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="search" type="text" placeholder="Search rules… ( / )" aria-label="Search artifacts"/>
    </div>
  </header>

  <div class="body">
    <nav class="sidebar" id="sidebar" aria-label="Artifacts"></nav>

    <main class="main">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" aria-selected="true"  data-view="graph">Dependency graph</button>
        <button class="tab" role="tab" aria-selected="false" data-view="flow">RuleFlow</button>
        <button class="tab" role="tab" aria-selected="false" data-view="json">Descriptor</button>
        <button class="tab" disabled title="Execute rules with sample bindings — later phase">Playground <em>· phase 4</em></button>
      </div>

      <div class="canvas-wrap">
        <!-- ══ Graph view ══ -->
        <section class="view on" id="view-graph">
          <div class="canvas-hud">
            <div class="legend">
              <span class="li"><span class="sw" style="background:var(--c-rule)"></span>Rule</span>
              <span class="li"><span class="sw sq" style="background:var(--c-ruleset)"></span>RuleSet</span>
              <span class="li"><span class="sw dm" style="background:var(--c-flow)"></span>RuleFlow</span>
              <span class="li"><span class="sw" style="background:var(--c-bind); width:7px; height:7px;"></span>Binding</span>
              <span class="sep"></span>
              <span class="li"><span class="edge-sw"></span>runs</span>
              <span class="li"><span class="edge-sw dash"></span>dynamic lookup</span>
              <span class="li"><span class="edge-sw dot"></span>data</span>
              <span class="sep"></span>
              <label><input type="checkbox" id="toggle-bindings" checked> show bindings</label>
            </div>
            <span class="hint-chip">drag nodes · hover to trace · click for details</span>
          </div>
          <svg class="stage" id="graph-svg" role="img" aria-label="Dependency graph of rules, rulesets and ruleflows"></svg>
          <div class="tooltip" id="tooltip"></div>
        </section>

        <!-- ══ Flow view ══ -->
        <section class="view" id="view-flow">
          <div class="flow-scroll"><div class="flow-inner" id="flow-inner"></div></div>
        </section>

        <!-- ══ JSON view ══ -->
        <section class="view" id="view-json">
          <div class="json-scroll">
            <div class="json-card">
              <div class="bar"><span class="method">GET</span><code>/actuator/rulii</code><span>· the descriptor document the whole UI renders from</span></div>
              <pre id="json-pre"></pre>
            </div>
          </div>
        </section>
      </div>
    </main>

    <aside class="detail" id="detail" aria-label="Artifact details"></aside>
  </div>
</div>

<script>
"use strict";
/* ════════════════════ sample data ════════════════════
   Modeled on real rulii-spring artifacts: XML rules with SpEL,
   annotated classes, a lambda rule, predefined validators,
   rulesets, and two ruleflows with static + dynamic targets. */

const C = () => getComputedStyle(document.documentElement);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const ARTIFACTS = [
  { id:'ageCheckRule', type:'rule', kind:'XML · SpEL', name:'AgeCheckRule',
    desc:'Customer must be an adult to place an order.',
    source:'classpath:rules/order/validation.xml',
    exprs:[ ['given', '#ctx.customer.age >= 18'] ],
    reads:['customer'], writes:[], messageCode:'order.age.violation' },

  { id:'minTotalRule', type:'rule', kind:'XML · SpEL', name:'MinTotalRule',
    desc:'Order total must meet the configured minimum.',
    source:'classpath:rules/order/validation.xml',
    exprs:[ ['given', '#ctx.order.total >= ${order.minTotal:100}'] ],
    reads:['order'], writes:[], messageCode:'order.minTotal.violation',
    note:'Placeholder resolved at compile time from the Spring Environment.' },

  { id:'emailFormatRule', type:'rule', kind:'predefined · r:email', name:'EmailFormatRule',
    desc:'Customer email must be a valid address.',
    source:'classpath:rules/order/validation.xml',
    exprs:[ ['validates', 'customer.email'] ],
    reads:['customer'], writes:[], messageCode:'order.email.invalid' },

  { id:'consistentDateRule', type:'rule', kind:'@Rule class', name:'ConsistentDateRule',
    desc:'Delivery date must be on or after the order date.',
    source:'org.rulii.spring.test.rules.setb.ConsistentDateRule',
    exprs:[ ['given', 'boolean when(Date orderDate, Date deliveryDate)'] ],
    reads:['order'], writes:[], messageCode:'order.dates.inconsistent' },

  { id:'approveRule', type:'rule', kind:'XML · SpEL', name:'ApproveRule',
    desc:'Approves the order and records the decision.',

  { id:'b_order',      type:'binding', name:'order',      bindType:'Order' },
  { id:'b_customer',   type:'binding', name:'customer',   bindType:'Customer' },

  { id:'b_fraudScore', type:'binding', name:'fraudScore', bindType:'Double' },
  { id:'b_openOrders', type:'binding', name:'openOrders', bindType:'List<Order>' },
];

const byId = Object.fromEntries(ARTIFACTS.map(a => [a.id, a]));

/* edges */
const EDGES = [];
for (const a of ARTIFACTS) {
  if (a.members) a.members.forEach(m => EDGES.push({ s:a.id, t:m, type:'contains' }));
  if (a.runs) a.runs.forEach(([m, how]) =>
    EDGES.push({ s:a.id, t:m, type: how.includes('dynamic') ? 'dynamic' : 'runs', label: how }));
  const bind = n => 'b_' + n;
  (a.reads  || []).forEach(n => byId[bind(n)] && EDGES.push({ s:bind(n), t:a.id, type:'databind', rw:'reads'  }));
  (a.writes || []).forEach(n => byId[bind(n)] && EDGES.push({ s:a.id, t:bind(n), type:'databind', rw:'writes' }));
}

/* ════════════════════ top bar stats ════════════════════ */
const counts = { rule:0, ruleset:0, ruleflow:0, binding:0 };
ARTIFACTS.forEach(a => counts[a.type]++);
document.getElementById('stats').innerHTML =
  `<span><b>${counts.rule}</b> rules</span><span><b>${counts.ruleset}</b> rulesets</span><span><b>${counts.ruleflow}</b> ruleflows</span>`;

/* ════════════════════ sidebar ════════════════════ */
const GROUPS = [
  ['ruleflow','RuleFlows'], ['ruleset','RuleSets'], ['rule','Rules'],
];
const typeColor = t => ({ rule:'var(--c-rule)', ruleset:'var(--c-ruleset)', ruleflow:'var(--c-flow)', binding:'var(--c-bind)' })[t];
const dotClass  = t => t === 'ruleset' ? 'dot sq' : t === 'ruleflow' ? 'dot dm' : 'dot';

function renderSidebar(filter) {
  const q = (filter || '').toLowerCase();
  const el = document.getElementById('sidebar');
  el.innerHTML = '';
  for (const [type, label] of GROUPS) {
    const items = ARTIFACTS.filter(a => a.type === type &&
      (!q || a.name.toLowerCase().includes(q) || (a.desc||'').toLowerCase().includes(q)));
    if (!items.length) continue;
    const h = document.createElement('div');
    h.className = 'group-label';
    h.innerHTML = `<span>${label}</span><span class="count">${items.length}</span>`;
    el.appendChild(h);
    for (const a of items) {
      const b = document.createElement('button');
      b.className = 'item' + (state.selected === a.id ? ' active' : '');
      b.dataset.id = a.id;
      b.innerHTML = `<span class="${dotClass(type)}" style="background:${typeColor(type)}"></span>
        <span class="txt"><div class="nm">${esc(a.name)}</div><div class="sub">${esc(a.kind || '')}</div></span>`;
      b.addEventListener('click', () => select(a.id, true));
      el.appendChild(b);
    }
  }
}

/* ════════════════════ force-directed graph ════════════════════
   Hand-rolled simulation (no external libs): charge repulsion,
   link springs, mild centering — the same model d3-force uses. */

const svg = document.getElementById('graph-svg');
const NS = 'http://www.w3.org/2000/svg';
const state = { selected: null, showBindings: true, hover: null };

const nodes = ARTIFACTS.map((a, i) => ({
  a, id: a.id,
  r: a.type === 'binding' ? 7 : a.type === 'rule' ? 13 : 17,
  x: 0, y: 0, vx: 0, vy: 0, fx: null, fy: null,
}));
const nodeById = Object.fromEntries(nodes.map(n => [n.id, n]));
const links = EDGES.map(e => ({ ...e, source: nodeById[e.s], target: nodeById[e.t] }));

let W = 800, H = 600;
function seed() {
  nodes.forEach((n, i) => {
    const ang = (i / nodes.length) * Math.PI * 2;
    const rad = n.a.type === 'ruleflow' ? 60 : n.a.type === 'binding' ? 250 : 160;
    n.x = W/2 + Math.cos(ang) * rad + (i % 5) * 7;
    n.y = H/2 + Math.sin(ang) * rad + (i % 3) * 7;
  });
}

let alpha = 1;
const activeLinks = () => links.filter(l => state.showBindings || l.type !== 'databind');
const visible = n => state.showBindings || n.a.type !== 'binding';

function tick() {
  const vis = nodes.filter(visible);
  // repulsion
  for (let i = 0; i < vis.length; i++) for (let j = i+1; j < vis.length; j++) {
    const a = vis[i], b = vis[j];
    let dx = b.x - a.x, dy = b.y - a.y;
    let d2 = dx*dx + dy*dy || 1;
    const min = (a.r + b.r + 34); // collision-ish floor
    const d = Math.sqrt(d2);
    let f = -1300 / d2;
    if (d < min) f -= (min - d) * 0.06 / d;
    const fx = dx * f, fy = dy * f;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  // springs
  for (const l of activeLinks()) {
    const rest = l.type === 'contains' ? 78 : l.type === 'databind' ? 95 : 120;
    const k = l.type === 'databind' ? 0.012 : 0.03;
    let dx = l.target.x - l.source.x, dy = l.target.y - l.source.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = k * (d - rest) / d;
    l.source.vx += dx*f; l.source.vy += dy*f;
    l.target.vx -= dx*f; l.target.vy -= dy*f;
  }
  // centering + integrate
  for (const n of vis) {
    n.vx += (W/2 - n.x) * 0.004; n.vy += (H/2 - n.y) * 0.004;
    if (n.fx != null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; continue; }
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += n.vx * alpha; n.y += n.vy * alpha;
    n.x = Math.max(n.r+8, Math.min(W-n.r-8, n.x));
    n.y = Math.max(n.r+8, Math.min(H-n.r-8, n.y));
  }
  alpha = Math.max(alpha * 0.995, 0.12);
}

/* build DOM once */
let edgeEls = [], nodeEls = [], selRing;
function buildGraph() {
  svg.innerHTML = '';
  const defs = document.createElementNS(NS,'defs');
  defs.innerHTML = `
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="var(--ink-2)" opacity="0.7"/>
    </marker>
    <marker id="arr-m" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6.4" markerHeight="6.4" orient="auto-start-reverse">
      <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="var(--muted)" opacity="0.7"/>
    </marker>`;
  svg.appendChild(defs);

  const gE = document.createElementNS(NS,'g');
  const gN = document.createElementNS(NS,'g');
  svg.appendChild(gE); svg.appendChild(gN);

  edgeEls = activeLinksAll().map(l => {
    const p = document.createElementNS(NS,'path');
    p.setAttribute('class', 'g-edge ' + l.type);
    if (l.type === 'runs' || l.type === 'dynamic') p.setAttribute('marker-end','url(#arr)');
    if (l.type === 'databind') p.setAttribute('marker-end','url(#arr-m)');
    gE.appendChild(p);
    return { l, p };
  });

  selRing = document.createElementNS(NS,'circle');
  selRing.setAttribute('class','sel-ring');
  selRing.setAttribute('display','none');
  gN.appendChild(selRing);

  nodeEls = nodes.map(n => {
    const g = document.createElementNS(NS,'g');
    g.setAttribute('class','g-node');
    g.setAttribute('tabindex','0');
    g.setAttribute('role','button');
    g.setAttribute('aria-label', `${n.a.type} ${n.a.name}`);
    const col = typeColor(n.a.type);
    let shape;
    if (n.a.type === 'ruleset') {
      shape = document.createElementNS(NS,'rect');
      shape.setAttribute('width', n.r*2); shape.setAttribute('height', n.r*2);
      shape.setAttribute('rx', 5);
    } else if (n.a.type === 'ruleflow') {
      shape = document.createElementNS(NS,'rect');
      shape.setAttribute('width', n.r*1.9); shape.setAttribute('height', n.r*1.9);
      shape.setAttribute('rx', 4);
      shape.setAttribute('transform', `rotate(45 ${n.r*0.95} ${n.r*0.95})`);
    } else {
      shape = document.createElementNS(NS,'circle');
      shape.setAttribute('r', n.r);
    }
    shape.setAttribute('class','shape');
    shape.setAttribute('fill', col);
    g.appendChild(shape);

    const label = document.createElementNS(NS,'text');
    label.setAttribute('text-anchor','middle');
    label.textContent = n.a.name;
    g.appendChild(label);
    n.el = g; n.shapeEl = shape; n.labelEl = label;

    g.addEventListener('click', ev => { if (!n.dragged) select(n.id, false); });
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(n.id, false); } });
    g.addEventListener('pointerenter', () => { state.hover = n.id; applyEmphasis(); showTip(n); });
    g.addEventListener('pointerleave', () => { state.hover = null; applyEmphasis(); hideTip(); });
    g.addEventListener('pointerdown', ev => startDrag(n, ev));
    gN.appendChild(g);
    return n;
  });
  applyEmphasis();
}
function activeLinksAll() { return links; }

function render() {
  for (const { l, p } of edgeEls) {
    const on = state.showBindings || l.type !== 'databind';
    p.setAttribute('display', on ? null : 'none');
    if (!on) continue;
    const { source:s, target:t } = l;
    // trim to node edge so arrowheads sit outside the shape
    const dx = t.x - s.x, dy = t.y - s.y, d = Math.sqrt(dx*dx+dy*dy) || 1;
    const sr = s.r + 3, tr = t.r + 6;
    const x1 = s.x + dx/d*sr, y1 = s.y + dy/d*sr;
    const x2 = t.x - dx/d*tr, y2 = t.y - dy/d*tr;
    p.setAttribute('d', `M${x1},${y1} L${x2},${y2}`);
  }
  for (const n of nodes) {
    const on = visible(n);
    n.el.setAttribute('display', on ? null : 'none');
    if (!on) continue;
    if (n.a.type === 'ruleset') n.shapeEl.setAttribute('x', -n.r), n.shapeEl.setAttribute('y', -n.r);
    if (n.a.type === 'ruleflow') {
      n.shapeEl.setAttribute('x', -n.r*0.95); n.shapeEl.setAttribute('y', -n.r*0.95);
      n.shapeEl.setAttribute('transform', 'rotate(45)');
    }
    n.el.setAttribute('transform', `translate(${n.x},${n.y})`);
    n.labelEl.setAttribute('y', n.r + 14);
    if (n.a.type === 'binding') n.labelEl.setAttribute('class','kind-label');
  }
  if (state.selected && nodeById[state.selected] && visible(nodeById[state.selected])) {
    const n = nodeById[state.selected];
    selRing.setAttribute('display', null);
    selRing.setAttribute('cx', n.x); selRing.setAttribute('cy', n.y);
    selRing.setAttribute('r', n.r + 5);
  } else selRing.setAttribute('display','none');
}

/* hover / selection emphasis */
function neighborsOf(id) {
  const set = new Set([id]);
  for (const l of links) {
    if (!state.showBindings && l.type === 'databind') continue;
    if (l.s === id) set.add(l.t);
    if (l.t === id) set.add(l.s);
  }
  return set;
}
function applyEmphasis() {
  const focus = state.hover || state.selected;
  if (!focus) {
    nodes.forEach(n => n.el.classList.remove('dim'));
    edgeEls.forEach(({p}) => p.classList.remove('dim'));
    return;
  }
  const nb = neighborsOf(focus);
  nodes.forEach(n => n.el.classList.toggle('dim', !nb.has(n.id)));
  edgeEls.forEach(({l, p}) => p.classList.toggle('dim', !(l.s === focus || l.t === focus)));
}

/* tooltip */
const tip = document.getElementById('tooltip');
function showTip(n) {
  const a = n.a;
  tip.innerHTML = `<div class="t-kind" style="color:${typeColor(a.type)}">${a.type}</div>
    <div class="t-name">${esc(a.name)}</div>
    ${a.desc ? `<div>${esc(a.desc)}</div>` : a.bindType ? `<div class="mono">${esc(a.bindType)}</div>` : ''}`;
  tip.style.display = 'block';
  positionTip(n);
}
function positionTip(n) {
  const wrap = svg.getBoundingClientRect();
  let x = n.x + 20, y = n.y - 10;
  tip.style.left = Math.min(x, wrap.width - 270) + 'px';
  tip.style.top  = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

/* drag */
function startDrag(n, ev) {
  ev.preventDefault();
  n.dragged = false;
  const rect = svg.getBoundingClientRect();
  const move = e => {
    n.dragged = true;
    n.fx = e.clientX - rect.left; n.fy = e.clientY - rect.top;
    alpha = Math.max(alpha, 0.5);
    if (REDUCED) settleAndRender(30);
  };
  const up = () => {
    n.fx = n.fy = null;
    setTimeout(() => n.dragged = false, 0);
    window.removeEventListener('pointermove', move);
    window.removeEventListener('pointerup', up);
  };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', up);
}

/* loop */
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function settleAndRender(iters) { for (let i = 0; i < iters; i++) tick(); render(); }
function loop() { tick(); render(); requestAnimationFrame(loop); }

function sizeGraph() {
  const r = svg.getBoundingClientRect();
  if (r.width) { W = r.width; H = r.height; }
}

/* ════════════════════ selection + detail panel ════════════════════ */
function select(id, fromList) {
  state.selected = id;
  renderSidebar(document.getElementById('search').value);
  renderDetail(byId[id]);
  applyEmphasis();
  alpha = Math.max(alpha, 0.3);
  if (REDUCED) render();
  const it = document.querySelector(`.item[data-id="${id}"]`);
  if (it && !fromList) it.scrollIntoView({ block:'nearest' });
}

function exprHtml(text) {
  return esc(text)
    .replace(/#ctx(\.\w+)*/g, m => `<span class="ctx">${m}</span>`)
    .replace(/\$\{[^}]*\}/g, m => `<span class="ph">${m}</span>`);
}

function relRow(id, kindLabel) {
  const a = byId[id];
  return `<li><button data-goto="${id}">
    <span class="dot" style="background:${typeColor(a.type)}"></span>
    <span class="nm">${esc(a.name)}</span>
    <span class="rel-kind">${esc(kindLabel)}</span></button></li>`;
}

function renderDetail(a) {
  const el = document.getElementById('detail');
  if (!a) {
    el.innerHTML = `<div class="empty">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="10" cy="10" r="5" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
        <rect x="22" y="6" width="9" height="9" rx="2" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
        <path d="M18 22 L24 28 L18 34 L12 28 Z" fill="none" stroke="var(--muted)" stroke-width="1.6"/>
        <path d="M14.5 12.5 L21.5 9 M12 15 L15.5 23" stroke="var(--muted)" stroke-width="1.2"/>
      </svg>
      <div>Select any rule, ruleset or ruleflow<br/>to inspect its definition.</div></div>`;
    return;
  }
  const col = typeColor(a.type);
  let html = `<div class="d-head">
    <span class="type-badge" style="color:${col}; background:color-mix(in srgb, ${col} 12%, transparent)">
      <span class="b-dot" style="background:${col}"></span>${a.type}</span>
    <div class="d-name">${esc(a.name)}</div>
    ${a.desc ? `<div class="d-desc">${esc(a.desc)}</div>` : ''}
  </div>`;

  if (a.type === 'binding') {
    html += `<div class="d-sec"><h4>Binding</h4><div class="kv">
      <span class="k">type</span><span class="v mono">${esc(a.bindType)}</span>
      <span class="k">read by</span><span class="v">${EDGES.filter(e=>e.s===a.id&&e.rw==='reads').length} artifacts</span>
      <span class="k">written by</span><span class="v">${EDGES.filter(e=>e.t===a.id&&e.rw==='writes').length} artifacts</span>
    </div></div>`;
    const readers = EDGES.filter(e => e.s === a.id).map(e => relRow(e.t, 'reads'));
    const writers = EDGES.filter(e => e.t === a.id && e.rw === 'writes').map(e => relRow(e.s, 'writes'));
    if (readers.length || writers.length)
      html += `<div class="d-sec"><h4>Used by</h4><ul class="rel-list">${writers.join('')}${readers.join('')}</ul></div>`;
  } else {
    html += `<div class="d-sec"><h4>Definition</h4><div class="kv">
      <span class="k">kind</span><span class="v">${esc(a.kind)}</span>
      <span class="k">source</span><span class="v mono">${esc(a.source)}</span>
      ${a.messageCode ? `<span class="k">message</span><span class="v mono">${esc(a.messageCode)}</span>` : ''}
    </div></div>`;

    if (a.opaque) {
      html += `<div class="d-sec"><h4>Expressions</h4>
        <div class="opaque-note">
          <svg width="14" height="14" viewBox="0 0 14 14" style="flex:0 0 auto; margin-top:2px" aria-hidden="true">
            <circle cx="7" cy="7" r="6" fill="none" stroke="var(--muted)" stroke-width="1.4"/>
            <path d="M7 4 v3.6 M7 9.8 v.4" stroke="var(--muted)" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span>Defined as an inline lambda — condition and action bodies are compiled code.
          Declared parameters and bindings below are still introspected.</span>
        </div></div>`;
    } else if (a.exprs) {
      html += `<div class="d-sec"><h4>Expressions</h4>` +
        a.exprs.map(([role, text]) =>
          `<div class="expr-role">${esc(role)}</div><div class="expr">${exprHtml(text)}</div>`).join('') +
        (a.note ? `<div class="expr-role" style="margin-top:10px">${esc(a.note)}</div>` : '') +
        `</div>`;
    }

    if (a.members) {
      html += `<div class="d-sec"><h4>Rules · in order</h4><ul class="rel-list">` +
        a.members.map(m => relRow(m, byId[m].kind.split(' ·')[0])).join('') + `</ul></div>`;
    }
    if (a.runs) {
      html += `<div class="d-sec"><h4>Runs</h4><ul class="rel-list">` +
        a.runs.map(([m, how]) => relRow(m, how)).join('') + `</ul></div>`;
    }
    const inSets = ARTIFACTS.filter(x => x.members && x.members.includes(a.id));
    const inFlows = ARTIFACTS.filter(x => x.runs && x.runs.some(r => r[0] === a.id));
    if (inSets.length || inFlows.length) {
      html += `<div class="d-sec"><h4>Used by</h4><ul class="rel-list">` +
        inSets.map(s => relRow(s.id, 'member of')).join('') +
        inFlows.map(f => relRow(f.id, 'run by')).join('') + `</ul></div>`;
    }
    const chips = (a.reads||[]).map(r => `<span class="b-chip" title="reads">${esc(r)} ←</span>`)
      .concat((a.writes||[]).map(w => `<span class="b-chip w" title="writes">${esc(w)} →</span>`));
    if (chips.length)
      html += `<div class="d-sec"><h4>Bindings <span style="font-weight:450; letter-spacing:0; text-transform:none">· ← reads · → writes</span></h4>
        <div class="chip-row">${chips.join('')}</div></div>`;
  }
  el.innerHTML = html;
  el.querySelectorAll('[data-goto]').forEach(b =>
    b.addEventListener('click', () => select(b.dataset.goto, false)));
}

/* ════════════════════ flow view ════════════════════ */
function buildFlow() {
  const cFlow = 'var(--c-flow)', cSet = 'var(--c-ruleset)', cRule = 'var(--c-rule)';
  const mx = 300;           // main spine x (center of nodes)
  const ax = 620;           // async lane x
  const nodeW = 220, nodeH = 46;

  const steps = [
    { y: 40,  kind:'PARAM',     label:'order : Order',                          sub:'required input' },
    { y: 116, kind:'BIND',      label:'fraudScore = 0.0',                       sub:'Double' },
    { y: 192, kind:'RUN',       label:'orderValidationRules',                   sub:'RuleSet · bean-ref', accent:cSet, link:'orderValidationRules' },
    { y: 292, kind:'WHEN',      label:'#ctx.order.total >= 500',                diamond:true },
    { y: 392, kind:'RUN',       label:'approvalRules',                          sub:'RuleSet · bean-ref', accent:cSet, link:'approvalRules', x: 148 },
    { y: 392, kind:'ACTION',    label:'#ctx.approved = true',                   sub:'otherwise', x: 452 },
    { y: 492, kind:'AWAIT',     label:'await fraudCheck',                       sub:'timeout 5 SECONDS' },
    { y: 568, kind:'RETURNING', label:'#ctx.approved && #ctx.fraudScore < 0.8', sub:'Boolean' },
  ];
  const asyncStep = { y: 192, kind:'ASYNC-RUN', label:'fraudCheck → FraudScoreRule', sub:'Rule · async bean-ref', accent:cRule, link:'fraudScoreRule', x: ax };
  const excStep   = { y: 292, kind:'ON-EXCEPTION', label:'#ctx.approved = false', sub:'ex bound in scope', x: ax };

  const H = 660, W2 = 860;
  let s = `<svg width="${W2}" height="${H}" viewBox="0 0 ${W2} ${H}" role="img" aria-label="orderProcessingFlow flowchart">`;
  s += `<defs><marker id="farr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
        <path d="M0,0.6 L7.4,4 L0,7.4 Z" fill="var(--ink-2)" opacity="0.75"/></marker></defs>`;

  // header
  s += `<text x="${mx}" y="18" text-anchor="middle" class="fl-label" style="font-size:13px; font-weight:650">orderProcessingFlow</text>`;
  s += `<text x="${ax}" y="150" text-anchor="middle" class="fl-lane-label">ASYNC LANE</text>`;
  s += `<line x1="${ax-140}" y1="160" x2="${ax+140}" y2="160" stroke="var(--hairline)"/>`;

  const edge = (x1,y1,x2,y2,cls,label,lx,ly) => {
    let d;
    if (x1 === x2) d = `M${x1},${y1} L${x2},${y2}`;
    else {
      const midY = (y1 + y2) / 2;
      d = `M${x1},${y1} L${x1},${midY-10} Q${x1},${midY} ${x1 + Math.sign(x2-x1)*10},${midY} L${x2 - Math.sign(x2-x1)*10},${midY} Q${x2},${midY} ${x2},${midY+10} L${x2},${y2}`;
    }
    let out = `<path d="${d}" class="fl-edge ${cls||''}" marker-end="url(#farr)"/>`;
    if (label) out += `<text x="${lx}" y="${ly}" class="fl-edge-label" text-anchor="middle">${esc(label)}</text>`;
    return out;
  };

  const box = (st) => {
    const x = st.x != null ? st.x : mx;
    let out = `<g class="fl-step" data-link="${st.link||''}" style="${st.link?'cursor:pointer':''}">`;
    if (st.diamond) {
      const w = 150, h = 42;
      out += `<path d="M${x},${st.y} L${x+w},${st.y+h/2+8} L${x},${st.y+h+16} L${x-w},${st.y+h/2+8} Z"
        fill="var(--surface)" stroke="var(--hairline)"/>`;
      out += `<text x="${x}" y="${st.y+18}" text-anchor="middle" class="fl-kind">WHEN</text>`;
      out += `<text x="${x}" y="${st.y+36}" text-anchor="middle" class="fl-label">${esc(st.label)}</text>`;
    } else {
      const acc = st.accent || cFlow;
      out += `<rect x="${x-nodeW/2}" y="${st.y}" width="${nodeW}" height="${nodeH}" rx="8"
        fill="var(--surface)" stroke="var(--hairline)"/>`;
      out += `<rect x="${x-nodeW/2}" y="${st.y}" width="3.5" height="${nodeH}" rx="1.75" fill="${acc}"/>`;
      out += `<text x="${x-nodeW/2+14}" y="${st.y+17}" class="fl-kind">${esc(st.kind)}</text>`;
      out += `<text x="${x-nodeW/2+14}" y="${st.y+33}" class="fl-label">${esc(st.label)}</text>`;
      if (st.sub) out += `<text x="${x+nodeW/2-10}" y="${st.y+17}" text-anchor="end" class="fl-sub">${esc(st.sub)}</text>`;
    }
    return out + `</g>`;
  };

  // edges (spine)
  s += edge(mx, steps[0].y+nodeH, mx, steps[1].y-4);
  s += edge(mx, steps[1].y+nodeH, mx, steps[2].y-4);
  s += edge(mx, steps[2].y+nodeH, mx, steps[3].y-4);
  const dTipY = steps[3].y + 29;
  s += edge(mx-150, dTipY, 148, steps[4].y-4, '', 'then', 168, dTipY-8);
  s += edge(mx+150, dTipY, 452, steps[5].y-4, '', 'otherwise', 438, dTipY-8);
  s += edge(148, steps[4].y+nodeH, mx, steps[6].y-4);
  s += edge(452, steps[5].y+nodeH, mx, steps[6].y-4);
  s += edge(mx, steps[6].y+nodeH, mx, steps[7].y-4);
  // async lane
  s += edge(mx+nodeW/2, steps[2].y+nodeH/2 - 24, ax - nodeW/2, asyncStep.y+nodeH/2 - 46, 'async', 'async-run', (mx+ax)/2+10, 158);
  s += `<path d="M${ax},${asyncStep.y+nodeH} L${ax},${excStep.y-4}" class="fl-edge async" marker-end="url(#farr)"/>`;
  s += `<text x="${ax+12}" y="${(asyncStep.y+nodeH+excStep.y)/2}" class="fl-edge-label">on-exception</text>`;
  s += `<path d="M${ax},${excStep.y+nodeH} L${ax},${steps[6].y+nodeH/2} L${mx+nodeW/2+6},${steps[6].y+nodeH/2}" class="fl-edge async" marker-end="url(#farr)"/>`;
  s += `<text x="${ax+12}" y="${(excStep.y+nodeH+steps[6].y)/2+14}" class="fl-edge-label">result → fraudScore</text>`;

  for (const st of steps) s += box(st);
  s += box(asyncStep); s += box(excStep);
  s += `</svg>`;

  const host = document.getElementById('flow-inner');
  host.innerHTML = s;
  host.querySelectorAll('.fl-step[data-link]').forEach(g => {
    if (!g.dataset.link) return;
    g.addEventListener('click', () => { select(g.dataset.link, false); setView('graph'); });
  });
}

/* ════════════════════ JSON view ════════════════════ */

  const st = t => `<span class="js">"${t}"</span>`;
  const n = t => `<span class="jn">${t}</span>`;
  const pre = document.getElementById('json-pre');
  pre.innerHTML =
`{
  ${k('rulii')}: ${st('1.3.0')},
  ${k('descriptorVersion')}: ${st('1.0')},
  ${k('application')}: ${st('order-service')},
  ${k('counts')}: { ${k('rules')}: ${n(9)}, ${k('rulesets')}: ${n(2)}, ${k('ruleflows')}: ${n(2)} },
  ${k('rules')}: [
    {
      ${k('name')}: ${st('MinTotalRule')},
      ${k('kind')}: ${st('xml')},
      ${k('language')}: ${st('el')},
      ${k('description')}: ${st('Order total must meet the configured minimum.')},
      ${k('source')}: ${st('classpath:rules/order/validation.xml')},
      ${k('given')}: ${st('#ctx.order.total &gt;= ${order.minTotal:100}')},
      ${k('parameters')}: [
        { ${k('name')}: ${st('order')}, ${k('type')}: ${st('com.acme.Order')}, ${k('required')}: <span class="jn">true</span> }
      ],
      ${k('messageCode')}: ${st('order.minTotal.violation')}
    }<span class="jc">,
    … 8 more rules elided …</span>
  ],
  ${k('rulesets')}: [
    {
      ${k('name')}: ${st('orderValidationRules')},
      ${k('preCondition')}: ${st('#ctx.order != null')},
      ${k('stopCondition')}: ${st('#ctx.violations.size() &gt;= 3')},
      ${k('rules')}: [ ${st('AgeCheckRule')}, ${st('MinTotalRule')}, ${st('EmailFormatRule')}, ${st('ConsistentDateRule')} ]
    }<span class="jc">, …</span>
  ],
  ${k('ruleflows')}: [
    {
      ${k('name')}: ${st('orderProcessingFlow')},
      ${k('commands')}: [
        { ${k('type')}: ${st('run')}, ${k('target')}: ${st('orderValidationRules')}, ${k('resolution')}: ${st('bean-ref')} },
        { ${k('type')}: ${st('async-run')}, ${k('target')}: ${st('fraudScoreRule')}, ${k('as')}: ${st('fraudCheck')} },
        { ${k('type')}: ${st('when')}, ${k('condition')}: ${st('#ctx.order.total &gt;= 500')},
          ${k('then')}: [ { ${k('type')}: ${st('run')}, ${k('target')}: ${st('approvalRules')} } ],
          ${k('otherwise')}: [ { ${k('type')}: ${st('action')}, ${k('script')}: ${st('#ctx.approved = true')} } ] },
        { ${k('type')}: ${st('await')}, ${k('names')}: [ ${st('fraudCheck')} ], ${k('timeout')}: ${n(5)}, ${k('unit')}: ${st('SECONDS')} }
      ],
      ${k('returning')}: ${st('#ctx.approved &amp;&amp; #ctx.fraudScore &lt; 0.8')}
    }<span class="jc">, …</span>
  ],
  ${k('edges')}: [
    { ${k('from')}: ${st('orderProcessingFlow')}, ${k('to')}: ${st('orderValidationRules')}, ${k('type')}: ${st('runs')} },
    { ${k('from')}: ${st('nightlyRepriceFlow')}, ${k('to')}: ${st('rangeCheckRule')}, ${k('type')}: ${st('runs')}, ${k('resolution')}: ${st('registry-lookup')} }<span class="jc">, …</span>
  ]
}`;
}

/* ════════════════════ tabs / wiring ════════════════════ */
function setView(v) {
  document.querySelectorAll('.tab[data-view]').forEach(t =>
    t.setAttribute('aria-selected', String(t.dataset.view === v)));
  document.querySelectorAll('.view').forEach(s => s.classList.remove('on'));
  document.getElementById('view-' + v).classList.add('on');
  if (v === 'graph') { sizeGraph(); if (REDUCED) render(); }
}
document.querySelectorAll('.tab[data-view]').forEach(t =>
  t.addEventListener('click', () => setView(t.dataset.view)));

document.getElementById('toggle-bindings').addEventListener('change', e => {
  state.showBindings = e.target.checked;
  alpha = 0.9;
  applyEmphasis();
  if (REDUCED) settleAndRender(160);
});

const searchEl = document.getElementById('search');
searchEl.addEventListener('input', () => renderSidebar(searchEl.value));
searchEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = document.querySelector('.sidebar .item');
    if (first) select(first.dataset.id, true);
  }
});
window.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
});

window.addEventListener('resize', () => { sizeGraph(); if (REDUCED) settleAndRender(40); });

/* boot */
sizeGraph();
seed();
buildGraph();
renderSidebar('');
renderDetail(null);
buildFlow();
buildJson();
if (REDUCED) settleAndRender(320);
else { settleAndRender(120); loop(); }
select('orderProcessingFlow', false);
</script>
