<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rulii explorer — Application states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;font-family:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;background:#FAF5FF}
a{color:#452C5B}a:hover{color:#301549}
</style>
</helmet>
<div style="--bg: {{t.bg}}; --top: {{t.top}}; --surface: {{t.surface}}; --card: {{t.card}}; --ink: {{t.ink}}; --ink2: {{t.ink2}}; --ink3: {{t.ink3}}; --line: {{t.line}}; --line2: {{t.line2}}; --accent: {{t.accent}}; --accentSoft: {{t.accentSoft}}; --sel: {{t.sel}}; --primary: {{t.primary}}; --onPrimary: {{t.onPrimary}}; --rule: {{t.rule}}; --ruleT: {{t.ruleT}}; --err: {{t.err}}; --errSoft: {{t.errSoft}}; --warn: {{t.warn}}; --warnSoft: {{t.warnSoft}}; --info: {{t.info}}; --infoSoft: {{t.infoSoft}}; --chipBg: {{t.chipBg}}; --chipInk: {{t.chipInk}}; --codeBg: {{t.codeBg}}; --codeInk: {{t.codeInk}}; --sh1: {{t.sh1}}; --logo-ink: {{t.logoInk}}; width: 1440px; height: 900px; box-sizing: border-box; display: grid; grid-template-rows: 64px minmax(0, 1fr); background: var(--bg); color: var(--ink); font-family: 'Hanken Grotesk', 'Segoe UI', system-ui, sans-serif; overflow: hidden">

<header style="box-sizing: border-box; height: 64px; display: flex; align-items: center; gap: 18px; padding: 0 24px; background: var(--top); border-bottom: 1px solid var(--line)">
  <div style="display: flex; align-items: center; gap: 14px; width: 216px">
    <svg viewBox="6 0 162 146" style="height: 34px; width: auto; display: block" role="img" aria-label="rulii">
      <defs>
        <linearGradient id="lg-o" gradientUnits="userSpaceOnUse" x1="14" y1="142" x2="116" y2="40"><stop offset="0.10" stop-color="#833EAE"></stop><stop offset="0.30" stop-color="#BB4683"></stop><stop offset="0.47" stop-color="#E1505F"></stop><stop offset="0.65" stop-color="#EB693F"></stop><stop offset="0.85" stop-color="#F5841D"></stop></linearGradient>
        <linearGradient id="lg-m" gradientUnits="userSpaceOnUse" x1="30.5" y1="125" x2="106.25" y2="49.25"><stop offset="0" stop-color="#F0762F"></stop><stop offset="0.22" stop-color="#E55B52"></stop><stop offset="0.37" stop-color="#DA4A6A"></stop><stop offset="0.56" stop-color="#B24589"></stop><stop offset="0.72" stop-color="#9140A3"></stop><stop offset="0.85" stop-color="#833EAE"></stop></linearGradient>
        <linearGradient id="lg-i" gradientUnits="userSpaceOnUse" x1="47.5" y1="105" x2="95.75" y2="56.75"><stop offset="0.03" stop-color="#B34588"></stop><stop offset="0.27" stop-color="#D4496F"></stop><stop offset="0.48" stop-color="#E2535C"></stop><stop offset="0.67" stop-color="#E7604C"></stop><stop offset="0.96" stop-color="#ED6F38"></stop></linearGradient>
      </defs>
      <g fill="none" stroke-width="10"><path d="M14 142V77.5A70 70 0 0 1 84 7.5" stroke="url(#lg-o)"></path><path d="M30.5 125V79.5A53.5 53.5 0 0 1 84 26" stroke="url(#lg-m)"></path><path d="M47.5 105V80.5A36.5 36.5 0 0 1 84 44" stroke="url(#lg-i)"></path></g>
      <g transform="translate(63.5 44.5) scale(0.24)"><g fill="none" style="stroke: var(--logo-ink)" stroke-width="35"><path d="M17.5 247V159.5A71 71 0 0 1 88.5 88.5H106"></path><path d="M88.5 129V157.5A71 71 0 0 0 230.5 157.5V71"></path><path d="M289.5 1V247"></path><path d="M346.5 71V247"></path><path d="M403.5 71V247"></path></g><circle cx="346.5" cy="17.5" r="17.5" fill="#F5841D"></circle><circle cx="403.5" cy="17.5" r="17.5" fill="#833EAE"></circle></g>
    </svg>
    <div style="width: 1px; height: 24px; background: var(--line2)"></div>
    <div style="display: flex; flex-direction: column; gap: 1px">
      <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink3)">Explorer</span>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 10px">
    <span style="font-size: 15px; font-weight: 600; color: var(--ink)">order-service</span>
    <span style="font-size: 11.5px; font-weight: 600; color: var(--accent); background: var(--accentSoft); padding: 3px 9px; border-radius: 999px">staging</span>
  </div>
  <div style="flex-grow: 1"></div>
  <button onClick="{{toggleTheme}}" aria-label="{{themeLabel}}" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1px solid var(--line2); border-radius: 10px; color: var(--ink2); cursor: pointer; padding: 0">
    <sc-if value="{{light}}" hint-placeholder-val="{{true}}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
    </sc-if>
    <sc-if value="{{dark}}" hint-placeholder-val="{{false}}">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"></path></svg>
    </sc-if>
  </button>
</header>

<main style="box-sizing: border-box; padding: 26px 40px 24px; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent)">Application states</div>
      <h1 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 26px; line-height: 1.2; color: var(--ink)">When there’s nothing to show, or something is in the way</h1>
    </div>
    <p style="margin: 0; max-width: 420px; font-size: 13px; line-height: 1.5; color: var(--ink3); text-align: right">Each state appears in the content area. The shell stays in place, and there is always one clear next step.</p>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 20px">

    <!-- ── Empty application ── -->
    <figure style="margin: 0; box-sizing: border-box; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden">
      <figcaption style="height: 36px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--line)">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2)">Empty application</span>
        <span style="font: 500 11px 'JetBrains Mono', Consolas, monospace; color: var(--ink3)">HTTP 200 · 0 artifacts</span>
      </figcaption>
      <div style="flex-grow: 1; box-sizing: border-box; display: flex; align-items: center; gap: 28px; padding: 24px 40px">
        <svg viewBox="8 2 78 141" style="height: 116px; width: auto; flex: 0 0 auto" aria-hidden="true"><g fill="none" stroke-width="10" style="stroke: var(--line2)"><path d="M14 142V77.5A70 70 0 0 1 84 7.5"></path><path d="M30.5 125V79.5A53.5 53.5 0 0 1 84 26"></path><path d="M47.5 105V80.5A36.5 36.5 0 0 1 84 44"></path></g></svg>
        <div style="display: flex; flex-direction: column; gap: 10px; align-items: flex-start; min-width: 0">
          <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 22px; line-height: 1.25; color: var(--ink)">No rules in order-service yet</h2>
          <p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink2)">The explorer is connected, but the rule registry is empty. Rules, rule sets and flows you define with <span style="font: 500 12px 'JetBrains Mono', Consolas, monospace; color: var(--chipInk); background: var(--chipBg); padding: 1px 5px; border-radius: 4px">@Rule</span>, the rulii builders or rulii XML appear here as soon as the application starts.</p>
          <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ink3)">Using XML files? Check that <span style="font: 500 11.5px 'JetBrains Mono', Consolas, monospace; color: var(--ink2)">@RuleScan(xmlLocations = …)</span> points at them.</p>
          <a href="#docs-getting-started" style="display: flex; align-items: center; gap: 6px; height: 32px; font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none">Read the getting-started guide<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
        </div>
      </div>
    </figure>

    <!-- ── Endpoint not exposed ── -->
    <figure style="margin: 0; box-sizing: border-box; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden">
      <figcaption style="height: 36px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--line)">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2)">Endpoint not exposed</span>
        <span style="font: 500 11px 'JetBrains Mono', Consolas, monospace; color: var(--ink3)">HTTP 404 · /actuator/rulii</span>
      </figcaption>
      <div style="flex-grow: 1; box-sizing: border-box; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 16px; align-content: center; padding: 20px 32px">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--warnSoft); color: var(--warn); display: flex; align-items: center; justify-content: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9 16H3z"></path><path d="M12 10v4M12 17v.3"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.25; color: var(--ink)">The rule descriptor isn’t exposed</h2>
          <p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink2)">The explorer reads everything from <span style="font: 500 12px 'JetBrains Mono', Consolas, monospace; color: var(--ink)">/actuator/rulii</span>, and this application doesn’t expose that endpoint over HTTP yet. Add it to your configuration:</p>
          <div style="position: relative; box-sizing: border-box; background: var(--codeBg); border-radius: 10px; padding: 11px 14px; font: 400 12.5px/1.6 'JetBrains Mono', Consolas, monospace; color: var(--codeInk)">
            <div style="color: #808080"># application.properties</div>
            <div><span style="color: #FFC66D">management.endpoints.web.exposure.include</span><span style="color: #CC7832">=</span><span style="color: #6A8759">rulii</span></div>
            <button aria-label="Copy configuration" style="position: absolute; right: 8px; top: 8px; height: 26px; display: flex; align-items: center; gap: 5px; padding: 0 9px; border: 1px solid rgba(169, 183, 198, 0.28); border-radius: 6px; background: transparent; color: #A9B7C6; font: 600 11.5px 'Hanken Grotesk', system-ui, sans-serif; cursor: pointer"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V6a2 2 0 0 1 2-2h9"></path></svg>Copy</button>
          </div>
          <p style="margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--ink3)">Already exposing other endpoints? Add <span style="font: 500 11.5px 'JetBrains Mono', Consolas, monospace; color: var(--ink2)">rulii</span> to the list, for example <span style="font: 500 11.5px 'JetBrains Mono', Consolas, monospace; color: var(--ink2)">health,info,rulii</span>.</p>
          <div style="display: flex; align-items: center; gap: 14px">
            <button style="height: 34px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 8px; background: var(--card); color: var(--ink); font: 600 13px 'Hanken Grotesk', system-ui, sans-serif; cursor: pointer">Reload</button>
            <a href="#docs-exposure" style="font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none">How endpoint exposure works</a>
          </div>
        </div>
      </div>
    </figure>

    <!-- ── Sign-in required ── -->
    <figure style="margin: 0; box-sizing: border-box; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden">
      <figcaption style="height: 36px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--line)">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2)">Sign-in required</span>
        <span style="font: 500 11px 'JetBrains Mono', Consolas, monospace; color: var(--ink3)">HTTP 401 · or 403</span>
      </figcaption>
      <div style="flex-grow: 1; box-sizing: border-box; display: grid; grid-template-columns: 40px minmax(0, 1fr); column-gap: 16px; align-content: center; padding: 20px 32px">
        <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--sel); color: var(--ink); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
          <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-weight: 500; font-size: 20px; line-height: 1.25; color: var(--ink)">Sign in to see the rules</h2>
          <p style="margin: 0; font-size: 13.5px; line-height: 1.5; color: var(--ink2)">order-service protects its actuator endpoints, which is the recommended setup for production. Sign in to the application in this browser, then reload this page.</p>
          <div style="box-sizing: border-box; display: grid; grid-template-columns: 16px minmax(0, 1fr); column-gap: 10px; padding: 11px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="color: var(--info); margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 7.8v.4"></path></svg>
            <span style="font-size: 12.5px; line-height: 1.5; color: var(--ink2)"><span style="font-weight: 600; color: var(--ink)">Already signed in?</span> Your account can’t open <span style="font: 500 11.5px 'JetBrains Mono', Consolas, monospace">/actuator/rulii</span> (HTTP 403). Ask whoever manages order-service for access to its actuator endpoints.</span>
          </div>
          <div style="display: flex; align-items: center; gap: 14px">
            <button style="height: 34px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--primary); color: var(--onPrimary); font: 600 13px 'Hanken Grotesk', system-ui, sans-serif; cursor: pointer">Reload</button>
            <a href="#docs-security" style="font-size: 13px; font-weight: 600; color: var(--accent); text-decoration: none">Securing the explorer</a>
          </div>
        </div>
      </div>
    </figure>

    <!-- ── Partially described ── -->
    <figure style="margin: 0; box-sizing: border-box; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden">
      <figcaption style="height: 36px; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; background: var(--surface); border-bottom: 1px solid var(--line)">
        <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink2)">Partially described</span>
        <span style="font: 500 11px 'JetBrains Mono', Consolas, monospace; color: var(--ink3)">HTTP 200 · 18 of 19 described</span>
      </figcaption>
      <div style="flex-grow: 1; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 18px 24px; background: var(--bg)">
        <div role="status" style="box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: var(--warnSoft); border-radius: 10px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; color: var(--warn)"><path d="M12 3.5l9 16H3z"></path><path d="M12 10v4M12 17v.3"></path></svg>
          <span style="flex-grow: 1; font-size: 13px; line-height: 1.4; color: var(--ink)"><span style="font-weight: 600">1 artifact couldn’t be described.</span> The other 18 are shown as usual.</span>
          <a href="#problems" style="flex-shrink: 0; font-size: 12.5px; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 3px">See details</a>
        </div>
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 12px; min-height: 0">
          <div style="box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 12px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
              <span style="display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; color: var(--ink)"><svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke-dasharray="2 1.6" style="stroke: var(--rule); stroke-width: 1.4"></circle></svg>StockAvailableRule</span>
              <span style="font: 500 10.5px 'JetBrains Mono', Consolas, monospace; letter-spacing: 0.02em; color: var(--ink3)">UNDESCRIBABLE</span>
            </div>
            <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink2)">Reading this rule’s definition failed, so only its name and bean are shown. The rest of the application is unaffected.</p>
            <div style="box-sizing: border-box; padding: 7px 10px; background: var(--surface); border-radius: 8px; font: 400 11.5px/1.5 'JetBrains Mono', Consolas, monospace; color: var(--ink2)">[exception message from the application]</div>
          </div>
          <div aria-label="com.acme.order.rules" style="box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px">
            <div style="padding: 0 8px 6px; font: 500 11px 'JetBrains Mono', Consolas, monospace; color: var(--ink3)">com.acme.order.rules</div>
            <a href="#r-dates" style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 8px; color: var(--ink2); font-size: 13px; text-decoration: none"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" style="fill: var(--rule)"></circle></svg><span>ConsistentDatesRule</span></a>
            <a href="#r-stock" style="display: flex; align-items: center; gap: 10px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--sel); color: var(--ink); font-size: 13px; text-decoration: none"><svg width="10" height="10" viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="none" stroke-dasharray="2 1.6" style="stroke: var(--rule); stroke-width: 1.4"></circle></svg><span style="flex-grow: 1">StockAvailableRule</span><span style="font-size: 11px; color: var(--warn); font-weight: 600">not described</span></a>
          </div>
        </div>
      </div>
    </figure>

  </div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: {
        bg: '#FAF5FF', top: '#FFFFFF', surface: '#F5EDFC', card: '#FFFFFF',
        ink: '#301549', ink2: '#4E3F66', ink3: '#6E5F82', line: '#ECE2F6', line2: '#DCCDEC',
        accent: '#C2410C', accentSoft: '#FFF0E5', sel: '#EBDDF9',
        primary: '#452C5B', onPrimary: '#FFFFFF',
        rule: '#833EAE', ruleT: '#6B2E94',
        err: '#B42318', errSoft: '#FDECEA', warn: '#9A5B00', warnSoft: '#FFF4DB', info: '#5B4E75', infoSoft: '#F0EBF6',
        chipBg: '#EEEAF3', chipInk: '#3E3450', codeBg: '#1A0E2E', codeInk: '#A9B7C6',
        sh1: '0 1px 2px rgba(48, 21, 73, 0.08)', logoInk: '#301549'
      },
      dark: {
        bg: '#221433', top: '#291A3D', surface: '#291A3D', card: '#2F2045',
        ink: '#F5EFFB', ink2: '#D6CBE3', ink3: '#AE9FC2', line: '#3A2A52', line2: '#4B3868',
        accent: '#FF9A3D', accentSoft: '#43291D', sel: '#3A2858',
        primary: '#CFAAF0', onPrimary: '#221433',
        rule: '#B98AE6', ruleT: '#CFAAF0',
        err: '#FF8F80', errSoft: '#45222B', warn: '#F5C451', warnSoft: '#3A3016', info: '#CFC3DD', infoSoft: '#352A48',
        chipBg: '#3A2E4E', chipInk: '#E0D7EA', codeBg: '#1A0E2E', codeInk: '#A9B7C6',
        sh1: '0 1px 2px rgba(0, 0, 0, 0.30)', logoInk: '#FFFFFF'
      }
    };
    const theme = (this.state && this.state.theme) || this.props.theme || 'light';
    const dark = theme === 'dark';
    return {
      t: dark ? T.dark : T.light,
      dark: dark,
      light: !dark,
      themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' })
    };
  }
}
</script>
</body>
