    const T = {
      light: {
        bg: '#FAF5FF', top: '#FFFFFF', surface: '#F5EDFC', card: '#FFFFFF',
        ink: '#301549', ink2: '#4E3F66', ink3: '#6E5F82', line: '#ECE2F6', line2: '#DCCDEC', edge: '#9A87B2',
        accent: '#C2410C', accentSoft: '#FFF0E5', sel: '#EBDDF9',
        rule: '#833EAE', set: '#F5841D', flow: '#0B8A86',
        sk: '#F1E8FA', skHi: 'rgba(255, 255, 255, 0.75)', logoInk: '#301549'
      },
      dark: {
        bg: '#221433', top: '#291A3D', surface: '#291A3D', card: '#2F2045',
        ink: '#F5EFFB', ink2: '#D6CBE3', ink3: '#AE9FC2', line: '#3A2A52', line2: '#4B3868', edge: '#9985B5',
        accent: '#FF9A3D', accentSoft: '#43291D', sel: '#3A2858',
        rule: '#B98AE6', set: '#FF9A3D', flow: '#3FCBC2',
        sk: '#3A2A52', skHi: 'rgba(255, 255, 255, 0.07)', logoInk: '#FFFFFF'
      }
    };
    const theme = (this.state && this.state.theme) || this.props.theme || 'light';
    const dark = theme === 'dark';
    return {
      t: dark ? T.dark : T.light,
      dark: dark,
      light: !dark,
      themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      toggleTheme: () => this.setState({ theme: dark ? 'light' : 'dark' })
    };
  }
}
</script>
